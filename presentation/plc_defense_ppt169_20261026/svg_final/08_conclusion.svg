<g id="conclusion" font-family="Arial, Microsoft YaHei, sans-serif"><text font-size="32" fill="#16324F" x="64" y="228">A working generation,</text><text font-size="32" fill="#16324F" x="64" y="272">compilation, and repair loop.</text><text font-size="32" fill="#007F82" x="64" y="384">A reproducible comparison</text><text font-size="32" fill="#007F82" x="64" y="428">with actual compiler and</text><text font-size="32" fill="#007F82" x="64" y="472">runtime evidence.</text></g>
<g id="limitations" font-family="Arial, Microsoft YaHei, sans-serif"><line x1="626" y1="182" x2="626" y2="524" stroke="#CCD6DE" stroke-width="2" /><text x="680" y="218" font-size="24" font-weight="700" fill="#16324F">Limits of the evidence</text><text font-size="24" fill="#182C3A" x="680" y="281">Finite scalar tests.</text><text font-size="24" fill="#182C3A" x="680" y="315">Timed and composite cases remain open.</text><text x="680" y="380" font-size="24" fill="#182C3A">No complete LTL model checking.</text><text font-size="24" fill="#182C3A" x="680" y="445">One run per task and condition.</text><text font-size="24" fill="#182C3A" x="680" y="479">Relay identity and prices unverified.</text></g>
