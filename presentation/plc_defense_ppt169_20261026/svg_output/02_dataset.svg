<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect id="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title"><text x="64" y="90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#16324F">A fixed dataset with explicit scan semantics</text></g>
<g id="dataset-table" font-family="Arial, Microsoft YaHei, sans-serif">
<rect x="64" y="156" width="496" height="48" fill="#F0F5F8"/>
<text x="84" y="187" font-size="20" fill="#526575">TASKS AND SPECIFICATIONS</text>
<text x="84" y="245" font-size="24" fill="#182C3A">Official public tasks</text><text x="532" y="245" text-anchor="end" font-size="24" fill="#007F82">20 / 20</text>
<line x1="64" y1="265" x2="560" y2="265" stroke="#CCD6DE"/>
<text x="84" y="305" font-size="24" fill="#182C3A">Self-developed tasks</text><text x="532" y="305" text-anchor="end" font-size="24" fill="#007F82">12</text>
<line x1="64" y1="325" x2="560" y2="325" stroke="#CCD6DE"/>
<text x="84" y="365" font-size="24" fill="#182C3A">LTL properties</text><text x="532" y="365" text-anchor="end" font-size="24" fill="#007F82">207</text>
<line x1="64" y1="385" x2="560" y2="385" stroke="#CCD6DE"/>
<text x="84" y="425" font-size="24" fill="#182C3A">Fixed functional cases</text><text x="532" y="425" text-anchor="end" font-size="24" fill="#007F82">81</text>
<line x1="64" y1="445" x2="560" y2="445" stroke="#CCD6DE"/>
<text x="84" y="485" font-size="24" fill="#182C3A">Scan observations</text><text x="532" y="485" text-anchor="end" font-size="24" fill="#007F82">576</text>
</g>
<g id="scan-contract" font-family="Arial, Microsoft YaHei, sans-serif">
<text x="624" y="188" font-size="32" fill="#16324F">One invocation = one observation</text>
<text x="624" y="244" font-size="24" fill="#182C3A"><tspan x="624">Sample inputs → execute logic</tspan><tspan x="624" dy="34">→ observe outputs in the same scan.</tspan></text>
<text x="624" y="343" font-size="20" fill="#526575">Guarded motor safety, SELF001</text>
<text x="624" y="389" font-family="Consolas, monospace" font-size="22" fill="#007F82">G((Stop | !GuardClosed) → !Run)</text>
<text x="624" y="450" font-size="20" fill="#526575">Example: stop overrides a held start request.</text>
<rect x="624" y="474" width="592" height="74" fill="#F0F5F8"/>
<text x="644" y="505" font-family="Consolas, monospace" font-size="22" fill="#182C3A">Start=1, Stop=1, GuardClosed=1</text>
<text x="644" y="535" font-family="Consolas, monospace" font-size="22" fill="#007F82">Run=0 at the end of this scan</text>
</g>
<g id="takeaway"><text x="64" y="603" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#16324F">Every task records provenance, interface, initialization, priorities, LTL, and expected tests.</text></g>
<g id="footer"><text x="64" y="676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">Source: frozen dataset JSON and dataset/CONTRACT.md · Finite tests do not prove all LTL properties.</text><text x="1216" y="676" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">02 / 08</text></g>
</svg>
