<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#007F82"/></marker></defs>
<rect id="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title"><text x="64" y="90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#16324F">A bounded compiler-feedback loop</text></g>
<g id="pipeline" font-family="Arial, Microsoft YaHei, sans-serif" fill="#182C3A">
<rect x="64" y="224" width="244" height="126" fill="#F0F5F8" stroke="#CCD6DE"/><text x="86" y="268" font-size="24" font-weight="700">Analyze task</text><text x="86" y="309" font-size="20" fill="#526575">Interface, LTL, priorities</text>
<rect x="364" y="224" width="244" height="126" fill="#F0F5F8" stroke="#CCD6DE"/><text x="386" y="268" font-size="24" font-weight="700">Generate ST</text><text x="386" y="309" font-size="20" fill="#526575">Structured candidate</text>
<rect x="664" y="224" width="244" height="126" fill="#16324F"/><text x="686" y="268" font-size="24" font-weight="700" fill="#FFFFFF">CODESYS build</text><text x="686" y="309" font-size="20" fill="#FFFFFF">Isolated real project</text>
<rect x="964" y="224" width="252" height="126" fill="#F0F5F8" stroke="#CCD6DE"/><text x="986" y="268" font-size="24" font-weight="700">Evaluate tests</text><text x="986" y="309" font-size="20" fill="#526575">Separate runtime stage</text>
<line x1="308" y1="287" x2="354" y2="287" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/><line x1="608" y1="287" x2="654" y2="287" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/><line x1="908" y1="287" x2="954" y2="287" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="534" y="425" width="372" height="94" fill="#FFFFFF" stroke="#007F82" stroke-width="2"/><text x="720" y="464" text-anchor="middle" font-size="24" fill="#007F82">Filter diagnostics → repair</text><text x="720" y="498" text-anchor="middle" font-size="20" fill="#526575">Current code + focused errors</text>
<path d="M 786 350 L 786 415" fill="none" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/><path d="M 534 472 L 486 472 L 486 360" fill="none" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="816" y="389" font-size="20" fill="#A43732">Build errors</text>
</g>
<g id="budget"><text x="64" y="169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#526575">One generation + at most two compiler-guided repairs</text></g>
<g id="evidence"><line x1="64" y1="574" x2="1216" y2="574" stroke="#CCD6DE"/><text x="64" y="616" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#16324F">Retain every candidate, response, diagnostic, build project, and result.</text></g>
<g id="footer"><text x="64" y="676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">Stop on compilation success, exhausted budget, timeout, or infrastructure failure.</text><text x="1216" y="676" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">03 / 08</text></g>
</svg>
