<g id="title"><text x="64" y="90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#16324F">What this project establishes</text></g>
<g id="conclusion" font-family="Arial, Microsoft YaHei, sans-serif"><text x="64" y="228" font-size="32" fill="#16324F"><tspan x="64" dy="0">A working generation,</tspan><tspan x="64" dy="44">compilation, and repair loop.</tspan></text><text x="64" y="384" font-size="32" fill="#007F82"><tspan x="64" dy="0">A reproducible comparison</tspan><tspan x="64" dy="44">with actual compiler and</tspan><tspan x="64" dy="44">runtime evidence.</tspan></text></g>
<g id="limitations" font-family="Arial, Microsoft YaHei, sans-serif"><line x1="626" y1="182" x2="626" y2="524" stroke="#CCD6DE" stroke-width="2"/><text x="680" y="218" font-size="24" font-weight="700" fill="#16324F">Limits of the evidence</text><text x="680" y="281" font-size="24" fill="#182C3A"><tspan x="680" dy="0">Finite scalar tests.</tspan><tspan x="680" dy="34">Timed and composite cases remain open.</tspan></text><text x="680" y="380" font-size="24" fill="#182C3A">No complete LTL model checking.</text><text x="680" y="445" font-size="24" fill="#182C3A"><tspan x="680" dy="0">One run per task and condition.</tspan><tspan x="680" dy="34">Relay identity and prices unverified.</tspan></text></g>
<g id="next"><line x1="64" y1="574" x2="1216" y2="574" stroke="#CCD6DE"/><text x="64" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#526575">Next steps: controlled timing, composite caller bindings, and repeated experiments.</text></g>
<g id="footer"><text x="64" y="676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">Source code, task specifications, raw evidence, analysis scripts, and defense notes accompany this deck.</text><text x="1216" y="676" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#526575">08 / 08</text></g>
