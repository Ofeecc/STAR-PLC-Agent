[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-agent-final"
version = "0.2.0"
description = "Auditable CODESYS Structured Text agent benchmark and verification platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
plc-agent = "plc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = [
    ".git",
    ".venv",
    ".local",
    ".superpowers",
    "codesys/scripts",
    "组员原始运行记录",
    "dataset_versions",
    "dataset",
    "docs",
    "requirements",
    "results",
    "video",
    "presentation",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E501", # line length handled separately
    "E701", # multiple statements on one line (colon)
    "E702", # multiple statements on one line (semicolon)
    "E741", # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"dataset/*" = ["E731"]


