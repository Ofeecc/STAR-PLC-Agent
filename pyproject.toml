[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-agent-final"
version = "0.2.0"
description = "Auditable CODESYS Structured Text agent benchmark and verification platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
plc-agent = "plc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
